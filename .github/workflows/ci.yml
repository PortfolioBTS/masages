# Непрерывная проверка (пункт 7.1 плана). Что проверяется, как повторить локально,
# как обновлять закреплённые версии и какие jobs сделать обязательными в защите
# main — в docs/dev/ci.md.
#
# Все `uses:` закреплены полным SHA коммита, версия — в комментарии. Тег в чужом
# репозитории можно перепривязать на другой код (так уже крали секреты из CI),
# SHA — нельзя. Обновляет их Dependabot (.github/dependabot.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # По понедельникам: ловит новые уязвимости в зависимостях и поломки окружения
    # без единого коммита. Минуты нарочно «некруглые»: на ровные часы у GitHub
    # очередь и запуски задерживаются.
    - cron: '17 3 * * 1'

# Токен только на чтение: ни одному шагу запись в репозиторий не нужна.
permissions:
  contents: read

concurrency:
  # Новый push в тот же PR отменяет устаревший прогон. Прогоны main и ручные не
  # отменяются и не ждут друг друга (группа по SHA): у каждого коммита должен
  # быть свой законченный результат.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Имена для защиты main: «unit (ubuntu-latest)» и «unit (windows-latest)».
  # Windows ловит проблемы с путями и окончаниями строк — разработка идёт на нём.
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установить Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Установить зависимости
        run: npm ci
      - name: Юнит-тесты
        run: npm test

  # Покрытие юнит-тестов: ИНФОРМАТИВНО, ничего не блокирует (continue-on-error) и не входит в защиту main.
  # `node --test --experimental-test-coverage` запускает каждый test/*.test.js отдельным процессом и сводит
  # покрытие по всем (порог не задан намеренно: цифра нужна, чтобы видеть непокрытое — пробелы ревью W7 R5
  # находили только мутациями). Сквозные тесты сюда не входят: серверный процесс e2e собирал бы покрытие
  # отдельно (NODE_V8_COVERAGE), это сознательно не сделано. Таблица идёт в сводку прогона и в артефакт.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установить Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Установить зависимости
        run: npm ci
      - name: Юнит-тесты с покрытием
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee coverage-unit.txt
      - name: Сводка покрытия
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Покрытие юнит-тестов (информативно)'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' coverage-unit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Сохранить отчёт о покрытии
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: coverage-unit.txt
          if-no-files-found: ignore
          retention-days: 7

  # Сквозные тесты на настоящем Postgres. Только Linux: контейнеры сервисов
  # работают лишь там. Версия образа совпадает с локальным nyxo-pg-test. Образ закреплён и тегом,
  # и digest индекса (как actionlint ниже): тег в реестре можно перепривязать. Digest этого образа
  # обновляют вручную вместе с тегом (docs/dev/ci.md), Dependabot services.image не видит.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: nyxo
          POSTGRES_PASSWORD: nyxo-ci-only
          POSTGRES_DB: nyxo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyxo -d nyxo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установить Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Установить зависимости
        run: npm ci
      - name: Сквозные тесты
        # Адрес администраторский: раннер сам создаёт отдельную БД на каждый набор
        # и удаляет её после. Пароль одноразовый, от контейнера, снаружи недоступного.
        env:
          E2E_DATABASE_URL: postgresql://nyxo:nyxo-ci-only@127.0.0.1:5432/postgres
        run: npm run test:e2e
      - name: Сохранить логи серверов
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: test/e2e/.logs/
          # Папка .logs скрытая — без этого флага артефакт был бы пустым.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # Смоук в настоящем Chrome (docs/dev/testing.md): вход, группа по ссылке и по
  # заявке, файлы, поиск, удаление аккаунта — через Chrome DevTools Protocol, с
  # проверкой консоли и CSP. Chrome на образе ubuntu-latest предустановлен
  # (/usr/bin/google-chrome); раннер без браузера в CI падает, а не пропускает
  # прогон. Postgres тот же, что у e2e.
  #
  # Пока этот job не продержался зелёным на ubuntu-latest хотя бы в 10 прогонах main подряд, он НЕ входит в
  # обязательные проверки защиты main и НЕ является условием релиза (release.yml): девять UI-сценариев в CI
  # ничего не гарантируют, пока прогон нестабилен на этом образе (docs/dev/testing.md, «CI»). Красный
  # прогон при этом не прячется: job виден в проверках PR, снимки экрана и логи сохраняются.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: nyxo
          POSTGRES_PASSWORD: nyxo-ci-only
          POSTGRES_DB: nyxo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyxo -d nyxo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установить Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Установить зависимости
        run: npm ci
      - name: Смоук в браузере
        env:
          E2E_DATABASE_URL: postgresql://nyxo:nyxo-ci-only@127.0.0.1:5432/postgres
        run: npm run test:browser
      # Снимки экрана сохраняются и у зелёного прогона: по ним сверяют вид интерфейса
      # до и после правок разметки и стилей (docs/dev/testing.md).
      - name: Сохранить снимки экрана
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-screens
          path: test/browser/.screens/
          # Папка .screens скрытая — без этого флага артефакт был бы пустым.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Сохранить логи серверов
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-logs
          path: test/e2e/.logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # Зависимости: политика уязвимостей (scripts/audit-check.js, docs/dev/ci.md) и
  # подписи реестра. Скрипты установки не нужны и не запускаются: проверка не
  # должна исполнять чужой код.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установить Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Установить зависимости без скриптов установки
        id: install
        run: npm ci --ignore-scripts
      - name: Политика npm audit
        run: node scripts/audit-check.js
      # Выполняется, даже если политика не пройдена: обе проверки независимы,
      # и обе причины падения лучше увидеть за один прогон.
      - name: Подписи и происхождение пакетов
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit signatures

  # Синтаксис workflow, выражения ${{ }}, входы популярных actions и shellcheck
  # блоков run. Образ закреплён по digest, а не по тегу: тег в реестре тоже можно
  # перепривязать. Dependabot образы из `docker run` не обновляет — порядок
  # обновления в docs/dev/ci.md.
  workflows-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color .github/workflows/*.y*ml
