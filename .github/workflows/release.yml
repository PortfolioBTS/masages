# Релиз клиента (6.1/6.3, roadmap R10): на тег v* собирает манифест клиента и
# публикует GitHub Release с аттестацией. «Сборка» клиента — это сами файлы
# public/ (минификации нет), поэтому манифест воспроизводится из исходников:
# git checkout <тег> && npm ci && node scripts/release-manifest.js. Как сверять
# продакшен с релизом — docs/VERIFY.md, как устроен релиз — docs/dev/ci.md.
#
# Все `uses:` закреплены полным SHA коммита, версия — в комментарии (зачем — в
# ci.yml). Обновляет их Dependabot.
#
# Ручной запуск (workflow_dispatch) — репетиция: всё собирается и сравнивается,
# но Release не создаётся и аттестация не пишется (это только на теге).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Токен только на чтение; права на запись есть лишь у job `release` (ниже).
permissions:
  contents: read

concurrency:
  # Один релиз на тег; повторный запуск не отменяет идущий.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Юнит-тесты и манифест на двух ОС. Манифест не должен зависеть от ОС (LF,
  # сортировка по кодовым единицам): job `release` сравнивает результаты через cmp.
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установить Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Установить зависимости
        run: npm ci
      - name: Юнит-тесты
        run: npm test
      # commit берётся из GITHUB_SHA, время — из коммита (SOURCE_DATE_EPOCH не
      # нужен): два прогона одного коммита дают одни и те же файлы.
      # Открытый ключ журнала ключей (прозрачность ключей) попадает в манифест и release.json. Значение задаёт
      # оператор переменной репозитория KT_PUBLIC_KEY (Settings → Variables): это ОТКРЫТЫЙ ключ, секрета тут нет.
      # Пусто — журнал выключен, манифест без keys.kt. Должно совпасть с ключом, выведенным сервером из
      # KT_SIGNING_KEY, иначе сторож покажет расхождение (docs/VERIFY.md, docs/security/key-transparency.md, раздел 11).
      - name: Манифест клиента и файлы релиза
        env:
          KT_PUBLIC_KEY: ${{ vars.KT_PUBLIC_KEY }}
        run: node scripts/release-manifest.js --out release-out
      - name: Сохранить файлы релиза
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}
          path: release-out/
          if-no-files-found: error
          retention-days: 7

  # Те же сквозные тесты и проверка зависимостей, что в ci.yml, на ТОМ ЖЕ коммите тега (ревью W7 R5, З-11а): без
  # них тег на коммите без зелёного e2e и audit выпустил бы релиз, ведь юнит-тесты есть только в build. Это копии
  # jobs e2e и audit из ci.yml (workflow_call не подходит: у ci.yml своя группа concurrency по SHA, и вызов
  # из релиза встал бы в очередь за прогоном main того же коммита). Менять их надо вместе — это проверяет
  # test/ci-release-gates.test.js. Смоук в браузере (job browser) в условия релиза НЕ входит, пока он не доказал
  # стабильность на ubuntu-latest (см. комментарий к нему в ci.yml).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: nyxo
          POSTGRES_PASSWORD: nyxo-ci-only
          POSTGRES_DB: nyxo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyxo -d nyxo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установить Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Установить зависимости
        run: npm ci
      - name: Сквозные тесты
        env:
          E2E_DATABASE_URL: postgresql://nyxo:nyxo-ci-only@127.0.0.1:5432/postgres
        run: npm run test:e2e

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установить Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Установить зависимости без скриптов установки
        id: install
        run: npm ci --ignore-scripts
      - name: Политика npm audit
        run: node scripts/audit-check.js
      - name: Подписи и происхождение пакетов
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit signatures

  release:
    needs: [build, e2e, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # contents: write — создать Release; id-token и attestations — подписать
      # аттестацию происхождения (sigstore через OIDC GitHub).
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Скачать файлы релиза обеих ОС
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
      # release.json содержит версию Node, а setup-node берёт «последнюю 24.x»:
      # на двух ОС она может оказаться разной. Поэтому сравниваются файлы,
      # которые от ОС зависеть не должны, а release.json берётся с Ubuntu.
      - name: Манифест и суммы одинаковы на Ubuntu и Windows
        run: |
          set -euo pipefail
          for name in client-manifest.json SHA256SUMS; do
            cmp "artifacts/release-ubuntu-latest/$name" "artifacts/release-windows-latest/$name"
          done
          cmp <(jq -S 'del(.node)' artifacts/release-ubuntu-latest/release.json) \
              <(jq -S 'del(.node)' artifacts/release-windows-latest/release.json)
          mkdir release
          cp artifacts/release-ubuntu-latest/client-manifest.json artifacts/release-ubuntu-latest/release.json artifacts/release-ubuntu-latest/SHA256SUMS release/
      - name: Тег совпадает с версией и commit релиза
        if: ${{ github.ref_type == 'tag' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(jq -r .version release/release.json)
          commit=$(jq -r .commit release/release.json)
          if [[ "$TAG" != "v$version" && "$TAG" != "v$version-"* ]]; then
            echo "Тег $TAG не соответствует версии $version из package.json (ожидается v$version или v$version-суффикс)" >&2
            exit 1
          fi
          if [[ "$commit" != "$GITHUB_SHA" ]]; then
            echo "commit в release.json ($commit) не совпадает с коммитом тега ($GITHUB_SHA)" >&2
            exit 1
          fi
      - name: Аттестация происхождения файлов релиза
        if: ${{ github.ref_type == 'tag' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/client-manifest.json
            release/release.json
            release/SHA256SUMS
      - name: Создать GitHub Release
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(jq -r .version release/release.json)
          commit=$(jq -r .commit release/release.json)
          manifest_sha=$(jq -r .manifest.sha256 release/release.json)
          {
            echo "Клиент Nyxo $version, коммит \`$commit\`."
            echo
            echo "SHA-256 манифеста client-manifest.json: \`$manifest_sha\`"
            echo
            echo "Файлы релиза подтверждены аттестацией GitHub: \`gh attestation verify client-manifest.json --repo $REPO\`."
            echo "Как сверить работающий сайт с этим релизом (скрипт, sha256sum, PowerShell) — docs/VERIFY.md."
          } > release-notes.md
          gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" --notes-file release-notes.md \
            release/client-manifest.json release/release.json release/SHA256SUMS
